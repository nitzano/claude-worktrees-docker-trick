services:
  app:
    image: myapp-dev:latest # built once
    build: . # only when dependencies change
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app # the current worktree's code
      - /app/node_modules # don't shadow what the image installed (incl. pnpm's .pnpm store)
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/app # internal — always fixed
      ENV_NAME: ${COMPOSE_PROJECT_NAME:-app}
      APP_GREETING: ${APP_GREETING:-}
    depends_on: [db]

  db:
    image: postgres:16
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    healthcheck: # so `up --wait` returns only once psql can accept the seed
      test: ["CMD-SHELL", "pg_isready -U dev -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
